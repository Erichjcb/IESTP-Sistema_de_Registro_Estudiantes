<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro de Estudiantes</title>

    <!-- Conexión con el archivo CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Conexión con el archivo JavaScript -->
    <script src="js/script.js"></script>
</head>
<body>
    <div class="contenedor">
        <h1>Sistema de Registro de Estudiantes</h1>

        <form id="formulario">
            <label>Nombre</label>
            <input type="text" id="nombre" placeholder="Ingrese el nombre">

            <label>Apellido</label>
            <input type="text" id="apellido" placeholder="Ingrese el apellido">

            <label>Edad</label>
            <input type="number" id="edad">

            <label>Carrera</label>
            <input type="text" id="carrera" placeholder="Ingrese la carrera">

            <button type="submit">Registrar</button>
        </form>

        <hr>

        <h2>Lista de Estudiantes</h2>
        <table id="tabla">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Edad</th>
                    <th>Carrera</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se agregarán los estudiantes con JavaScript -->
            </tbody>
        </table>
    </div>
</body>
</html>
