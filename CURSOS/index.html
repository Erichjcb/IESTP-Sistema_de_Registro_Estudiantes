<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro de Estudiantes</title>

    <!-- Conexión con el archivo CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Conexión con el archivo JavaScript -->
    <script src="js/script.js" defer></script>
</head>
<body>
    <div class="contenedor">
        <!-- Logo de la institución -->
        <img src="img/logo.png" alt="Logo de la institución" width="120">

        <h1>Sistema de Registro de Estudiantes</h1>

        <form id="formulario">
            <label>Nombres</label>
            <input type="text" id="nombres" placeholder="Ingrese los nombres">

            <label>Apellido Paterno</label>
            <input type="text" id="apellidoPaterno" placeholder="Ingrese el apellido paterno">

            <label>Apellido Materno</label>
            <input type="text" id="apellidoMaterno" placeholder="Ingrese el apellido materno">

            <label>Edad</label>
            <input type="number" id="edad">

            <label>Carrera</label>
            <select id="carrera">
                <option value="">Seleccione una carrera</option>
                <option value="Mecatrónica Automotriz">Mecatrónica Automotriz</option>
                <option value="Administración de Servicios de Hostelería y Restaurantes">Administración de Servicios de Hostelería y Restaurantes</option>
                <option value="Arquitectura de Plataformas y Servicios de Tecnologías de Información">Arquitectura de Plataformas y Servicios de Tecnologías de Información</option>
                <option value="Asistencia Administrativa">Asistencia Administrativa</option>
                <option value="Contabilidad">Contabilidad</option>
                <option value="Enfermería Técnica">Enfermería Técnica</option>
            </select>

            <button type="submit">Registrar</button>
        </form>

        <hr>

        <!-- Cuadro de búsqueda -->
        <input
            type="text"
            id="buscar"
            placeholder="Buscar estudiante..."
        >

        <h2>Lista de Estudiantes</h2>
        <table id="tabla">
            <thead>
                <tr>
                    <th>Nombres</th>
                    <th>Apellido Paterno</th>
                    <th>Apellido Materno</th>
                    <th>Edad</th>
                    <th>Carrera</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <!-- Aquí se agregarán los estudiantes con JavaScript -->
            </tbody>
        </table>
    </div>
</body>
</html>
